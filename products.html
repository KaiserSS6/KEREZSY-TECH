<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Productos - KerezsyTech</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .prod-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:stretch;grid-auto-rows:1fr}
    .prod-card{background:#0f0f0f;border:1px solid #222;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;height:100%}
    .prod-card img{width:100%;height:140px;object-fit:cover}
    .prod-info{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
    .prod-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
    .price{color:var(--vs-blue)}
    .prod-actions{display:flex;gap:8px;align-items:center;height:40px}
    .add,.btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--white);cursor:pointer;text-decoration:none}
    .add svg,.btn svg{width:18px;height:18px}
    .add{background:var(--vs-blue);border:none}
    .prod-card .brand{color:var(--muted);font-size:13px}
    .desc{display:none}
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-left"><a class="logo" href="index.html"><img src="assets/logo-kerezsytech.jpeg" alt="KerezsyTech" class="site-logo"><span class="brand">KerezsyTech</span></a></div>
    <div class="nav-right">
      <a class="nav-icon" href="index.html" title="Inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></a>
      <a id="cartBtn" class="nav-icon" href="cart.html" title="Carrito">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="nav-svg"><path d="M7 4H5l-1 2H2v2h2l3.6 7.6c.2.5.7.8 1.2.8H19v-2h-8.2l-.9-1.9L19 8H8.2L7 4z" fill="currentColor"></path><circle cx="10" cy="19.5" r="1" fill="currentColor"></circle><circle cx="17" cy="19.5" r="1" fill="currentColor"></circle></svg>
        <span id="cartCount" class="cart-count">0</span>
      </a>
      <a class="nav-icon" href="login.html" title="Iniciar sesión">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-5 0-9 2.5-9 5v1h18v-1c0-2.5-4-5-9-5z"/></svg>
      </a>
      <button id="themeToggle" class="nav-icon" title="Cambiar modo" aria-pressed="false">
        <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
      </button>
    </div>
  </nav>

  <main class="container">
    <h2 id="pageTitle">Productos</h2>
    <div id="productsList" class="prod-grid"></div>
  </main>

  <script src="products-data.js"></script>
  <script src="products.js"></script>
  <script src="script.js"></script>
  <script>

    
    document.getElementById("cartCount").textContent=(JSON.parse(localStorage.getItem("kcart")||"[]").reduce((s,i)=>s+(i.qty||1),0));

   
    (function(){
      const params=new URLSearchParams(location.search);const cat=params.get('category')||'all';
      const map={all:'Productos',storage:'Almacenamiento',memory:'Memorias RAM',cpu:'Procesadores',motherboard:'Placas madre',gpu:'Tarjetas gráficas',psu:'Fuentes de poder',cooling:'Refrigeración',case:'Gabinetes',peripherals:'Periféricos',monitor:'Monitores'};
      const title=map[cat]||'Productos';
      const el=document.getElementById('pageTitle'); if(el) el.textContent=title;
    })();
  </script>
</body>
</html>
