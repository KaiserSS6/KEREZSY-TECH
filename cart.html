<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carrito - Kerezsy Tech</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .cart-table{width:100%;max-width:900px;border-collapse:collapse;margin:0 auto}
    .cart-table td,.cart-table th{padding:10px;border-bottom:1px solid #222;vertical-align:middle}
    .cart-table th:nth-child(1), .cart-table td:nth-child(1){text-align:left}
    .cart-table th:nth-child(2), .cart-table td:nth-child(2),
    .cart-table th:nth-child(3), .cart-table td:nth-child(3),
    .cart-table th:nth-child(4), .cart-table td:nth-child(4){text-align:center}
    .cart-thumb{width:90px;height:60px;object-fit:cover;border-radius:6px}
    .qty{width:56px;display:block;margin:0 auto;text-align:center;padding:6px 8px}
    .remove{background:#a00;border:none;color:#fff;padding:6px 8px;border-radius:6px;cursor:pointer}
    .proceed-btn{background:var(--vs-blue);color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer;margin-top:12px;font-weight:600}
    .cart-actions{display:flex;justify-content:center}
  </style>
</head>
<body class="cart-page">
  <nav class="navbar">
    <div class="nav-left"><a class="logo" href="index.html"><span class="brand">KerezsyTech</span></a></div>
    <div class="nav-right">
      <a class="nav-icon" href="index.html" title="Inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></a>
      <a class="nav-icon" href="login.html" title="Iniciar sesión"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-5 0-9 2.5-9 5v1h18v-1c0-2.5-4-5-9-5z"/></svg></a>
      <button id="themeToggle" class="nav-icon" title="Cambiar modo" aria-pressed="false">
        <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
      </button>
    </div>
  </nav>
  <main class="container">
    <h2>Tu carrito</h2>
    <div id="cartArea"></div>
  </main>

  <script src="script.js"></script>
  <script>
    function renderCart(){
      const cart = JSON.parse(localStorage.getItem("kcart")||"[]");
      const area = document.getElementById("cartArea");
      if(cart.length===0){ area.innerHTML = "<p>El carrito está vacío.</p>"; return; }
      let html = '<table class="cart-table"><tr><th>Producto</th><th>Precio</th><th>Cantidad</th><th>Total</th><th></th></tr>';
      cart.forEach((it,idx)=>{
        html += `<tr><td><img src="${it.image}" class="cart-thumb"> <strong>${it.title}</strong></td><td>${"$"+it.price.toFixed(2)}</td><td><input type="number" min="1" value="${it.qty||1}" data-idx="${idx}" class="qty"></td><td>${"$"+((it.price*(it.qty||1)).toFixed(2))}</td><td><button class="remove" data-idx="${idx}" aria-label="Eliminar producto">×</button></td></tr>`;
      });
      const total = cart.reduce((s,i)=>s + i.price*(i.qty||1),0);
      html += `<tr><td colspan="3"><strong>Total</strong></td><td><strong>$${total.toFixed(2)}</strong></td><td></td></tr></table>`;
      html += `<div class="cart-actions"><button id="proceedBtn" class="proceed-btn">Continuar con el pago</button></div>`;
      area.innerHTML = html;
      document.querySelectorAll(".qty").forEach(inp=>{inp.addEventListener("change",(e)=>{const i=e.target.dataset.idx;const v=parseInt(e.target.value)||1;cart[i].qty=v;localStorage.setItem("kcart",JSON.stringify(cart));renderCart();});});
      document.querySelectorAll(".remove").forEach(b=>{b.addEventListener("click",(e)=>{const i=e.target.dataset.idx;cart.splice(i,1);localStorage.setItem("kcart",JSON.stringify(cart));renderCart();});});
      const proceed = document.getElementById('proceedBtn');
      if(proceed){proceed.addEventListener('click', function(){
    
        const lines = [];
        lines.push('Pedido desde Kerezsy Tech');
        lines.push('');
        cart.forEach(it=>{
          const qty = it.qty||1;
          const subtotal = (it.price*qty).toFixed(2);
          lines.push(`${qty} x ${it.title} - $${it.price.toFixed(2)} (subtotal $${subtotal})`);
        });
        lines.push('');
        lines.push(`Total: $${total.toFixed(2)}`);
        lines.push('');
        lines.push('Por favor confirmar disponibilidad y forma de pago.');
        const msg = encodeURIComponent(lines.join('\n'));
        const phone = '584241976275';
        const url = `https://wa.me/${phone}?text=${msg}`;
        window.open(url, '_blank');
      });}
    }
    renderCart();
  </script>
</body>
</html>
